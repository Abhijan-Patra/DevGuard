name: Verify DevGuard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  boundaries-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock.txt -r requirements-ui.lock.txt -r requirements-client.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m pip check
      - run: node --check devguard/web/workspace.js
      - run: python -m pip wheel --no-deps --no-build-isolation -w /tmp/devguard-wheel .
