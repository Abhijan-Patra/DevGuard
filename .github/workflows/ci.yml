name: Verify DevGuard
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  boundaries-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock.txt -r requirements-ui.lock.txt -r requirements-client.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m pip check
      - run: node --check devguard/web/workspace.js
  wheel-install:
    name: Clean wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/release_audit.py dist
      - name: Install built wheel and verify API/assets/authentication
        run: python scripts/wheel_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-check-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/wheel-smoke.json

  windows-boundaries:
    name: Windows native boundaries (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise the actual PowerShell source installer
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Install test dependencies in the isolated environment
        run: .venv/Scripts/python -m pip install pytest==9.1.1 -r requirements-ui.lock.txt
      - name: Native filesystem, lifecycle, clipboard and common policy boundaries
        env:
          DEVGUARD_WINDOWS_CLIPBOARD_TEST: '1'
        run: .venv/Scripts/python -m pytest -q tests/windows tests/guard tests/backend tests/integration
      - run: .venv/Scripts/python -m pip check
