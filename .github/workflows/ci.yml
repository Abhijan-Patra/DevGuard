name: Verify DevGuard
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  boundaries-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock.txt -r requirements-ui.lock.txt -r requirements-client.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m pip check
      - run: node --check devguard/web/workspace.js
  wheel-install:
    name: Clean wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/release_audit.py dist
      - name: Install only the built wheel in a separate virtualenv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/devguard-installed"
          "$RUNNER_TEMP/devguard-installed/bin/python" -c 'from pathlib import Path; import subprocess,sys; subprocess.check_call([sys.executable,"-m","pip","install",str(next(Path("dist").glob("*.whl")))+"[clipboard,client]"])'
          "$RUNNER_TEMP/devguard-installed/bin/python" -m pip check
      - name: Verify installed assets, local authentication and privacy contract
        shell: bash
        run: '"$RUNNER_TEMP/devguard-installed/bin/python" -I scripts/release_smoke.py --output "$RUNNER_TEMP/wheel-smoke.json"'
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-check-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/wheel-smoke.json
