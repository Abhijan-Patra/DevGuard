name: Publish DevGuard release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the release tag matches the package version
        run: python -c 'import os,tomllib; assert os.environ["GITHUB_REF_NAME"] == "v"+tomllib.load(open("pyproject.toml","rb"))["project"]["version"]'
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/release_audit.py dist
      - name: Include tested runtime constraints and checksums
        run: |
          cp requirements-runtime.lock.txt requirements-client.lock.txt dist/
          python scripts/release_checksums.py dist
      - name: Publish reviewed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest --title "DevGuard $GITHUB_REF_NAME — Public preview" --notes-file docs/RELEASE_NOTES.md
