[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devguard"
version = "0.1.0"
description = "Local Gemma-powered privacy and backend investigation companion"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
clipboard = ["pyobjc-framework-Cocoa>=10,<13; sys_platform == 'darwin'"]
ui = ["streamlit>=1.35,<2"]

[project.scripts]
devguard = "devguard.__main__:main"

[tool.setuptools.packages.find]
include = ["devguard*"]

[tool.setuptools.package-data]
"devguard.ui" = ["dashboard.css"]
"devguard" = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
